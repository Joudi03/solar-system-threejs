<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sistem Solar - Three.js</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
    #info {
      position: absolute; top: 12px; left: 12px;
      color: #aef; font-size: 13px; line-height: 1.9;
      font-family: 'Courier New', monospace;
      background: rgba(0,0,20,0.7); padding: 12px 16px;
      border: 1px solid #1a4a6a; border-radius: 6px;
      pointer-events: none;
    }
    #info h2 { color: #7ef; margin-bottom: 4px; letter-spacing: 2px; }
    #info span { color: #5bf; }
    #focus-label {
      position: absolute; bottom: 30px; left: 50%;
      transform: translateX(-50%);
      color: #fff; font-size: 20px; letter-spacing: 4px;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 20px #7ef;
      pointer-events: none;
      transition: opacity 0.6s; opacity: 0;
    }
  </style>
</head>
<body>
  <div id="info">
    <h2>&#9728; SISTEM SOLAR</h2>
    <b>Mouse:</b> drag = rotire, scroll = zoom<br>
    <b>Click</b> pe planeta = focus<br>
    <span>1-8</span> = selectare rapida planeta<br>
    <span>R</span> = reset camera &nbsp; <span>P</span> = pauza<br>
    <span>+/-</span> = viteza animatie
  </div>
  <div id="focus-label"></div>

  <script src="three.js"></script>
  <script src="OrbitControls.js"></script>
  <script src="dat.gui.js"></script>

  <script>
  var W = window.innerWidth, H = window.innerHeight;

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000008);

  var camera = new THREE.PerspectiveCamera(60, W/H, 0.1, 5000);
  camera.position.set(0, 80, 200);
  camera.lookAt(0, 0, 0);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.minDistance = 5;
  controls.maxDistance = 1500;

  // LUMINI
  var sunLight = new THREE.PointLight(0xfff5cc, 2.5, 3000);
  sunLight.position.set(0, 0, 0);
  sunLight.castShadow = true;
  scene.add(sunLight);
  scene.add(new THREE.AmbientLight(0x111133, 1.0));
  scene.add(new THREE.HemisphereLight(0x0033aa, 0x001144, 0.4));

  // TEXTURI PROCEDURALE (THREE.Texture din canvas - r101)
  function makeTexture(drawFn, size) {
    size = size || 512;
    var canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    var ctx = canvas.getContext('2d');
    drawFn(ctx, size);
    var tex = new THREE.Texture(canvas);
    tex.needsUpdate = true;
    return tex;
  }

  var sunTexture = makeTexture(function(ctx, s) {
    var grd = ctx.createRadialGradient(s/2,s/2,s*0.05, s/2,s/2,s/2);
    grd.addColorStop(0, '#fff7aa'); grd.addColorStop(0.3, '#ffcc00');
    grd.addColorStop(0.7, '#ff8800'); grd.addColorStop(1, '#cc4400');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, s, s);
    for (var i=0;i<30;i++){
      ctx.beginPath(); ctx.arc(Math.random()*s,Math.random()*s,Math.random()*18+4,0,Math.PI*2);
      ctx.fillStyle='rgba(120,40,0,'+(Math.random()*0.5+0.2)+')'; ctx.fill();
    }
  }, 512);

  var earthTexture = makeTexture(function(ctx, s) {
    ctx.fillStyle='#1155bb'; ctx.fillRect(0,0,s,s);
    var sh=[[0.15,0.3,0.22,0.28],[0.5,0.2,0.28,0.38],[0.1,0.6,0.18,0.22],[0.62,0.55,0.22,0.22],[0.75,0.25,0.13,0.18]];
    for(var i=0;i<sh.length;i++){
      ctx.fillStyle='hsl('+(100+Math.random()*40)+','+(50+Math.random()*20)+'%,'+(35+Math.random()*15)+'%)';
      ctx.beginPath(); ctx.ellipse(sh[i][0]*s,sh[i][1]*s,sh[i][2]*s/2,sh[i][3]*s/2,Math.random()*Math.PI,0,Math.PI*2); ctx.fill();
    }
    for(var i=0;i<15;i++){
      ctx.beginPath(); ctx.ellipse(Math.random()*s,Math.random()*s,Math.random()*40+15,Math.random()*15+5,0,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,'+(Math.random()*0.3+0.1)+')'; ctx.fill();
    }
  }, 512);

  var marsTexture = makeTexture(function(ctx, s) {
    ctx.fillStyle='#c1440e'; ctx.fillRect(0,0,s,s);
    for(var i=0;i<50;i++){
      ctx.beginPath(); ctx.arc(Math.random()*s,Math.random()*s,Math.random()*18+2,0,Math.PI*2);
      ctx.strokeStyle='rgba(80,20,0,0.5)'; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle='rgba('+(150+Math.random()*50)+','+(40+Math.random()*25)+',10,0.3)'; ctx.fill();
    }
  }, 512);

  var jupiterTexture = makeTexture(function(ctx, s) {
    for(var y=0;y<s;y++){
      var v=y/s;
      ctx.fillStyle='hsl('+(25+Math.sin(v*Math.PI*16)*10)+','+(60+Math.sin(v*Math.PI*12)*20)+'%,'+(55+Math.sin(v*Math.PI*8)*15)+'%)';
      ctx.fillRect(0,y,s,1);
    }
    ctx.beginPath(); ctx.ellipse(s*0.55,s*0.55,s*0.08,s*0.05,-0.3,0,Math.PI*2);
    ctx.fillStyle='rgba(180,60,30,0.85)'; ctx.fill();
  }, 512);

  var saturnTexture = makeTexture(function(ctx, s) {
    for(var y=0;y<s;y++){
      var t=y/s;
      ctx.fillStyle='rgb('+Math.floor(180+Math.sin(t*Math.PI*10)*30)+','+Math.floor(160+Math.sin(t*Math.PI*8)*20)+','+Math.floor(100+Math.sin(t*Math.PI*6)*20)+')';
      ctx.fillRect(0,y,s,1);
    }
  }, 512);

  function solidTexture(h,s,l){
    return makeTexture(function(ctx,sz){
      var g=ctx.createRadialGradient(sz*0.4,sz*0.4,sz*0.05,sz/2,sz/2,sz/2);
      g.addColorStop(0,'hsl('+h+','+(s+20)+'%,'+(l+20)+'%)');
      g.addColorStop(1,'hsl('+h+','+s+'%,'+(l-10)+'%)');
      ctx.fillStyle=g; ctx.fillRect(0,0,sz,sz);
    }, 256);
  }

  // SOARE
  var sun = new THREE.Mesh(new THREE.SphereGeometry(12,48,48), new THREE.MeshBasicMaterial({map:sunTexture}));
  scene.add(sun);
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(14.5,32,32), new THREE.MeshBasicMaterial({color:0xffaa00,transparent:true,opacity:0.12,side:THREE.BackSide})));

  // DATE PLANETE
  var planetData = [
    {name:'Mercur', r:1.5, dist:22,  speed:4.74, rot:0.010, tex:solidTexture(30,20,50),  tilt:0.03},
    {name:'Venus',  r:3.2, dist:35,  speed:3.50, rot:0.005, tex:solidTexture(45,60,60),  tilt:3.10},
    {name:'Terra',  r:3.5, dist:50,  speed:2.98, rot:0.020, tex:earthTexture,            tilt:0.41},
    {name:'Marte',  r:2.5, dist:68,  speed:2.41, rot:0.018, tex:marsTexture,             tilt:0.44},
    {name:'Jupiter',r:8.5, dist:105, speed:1.31, rot:0.040, tex:jupiterTexture,          tilt:0.05},
    {name:'Saturn', r:7.0, dist:145, speed:0.97, rot:0.038, tex:saturnTexture,           tilt:0.47, rings:true},
    {name:'Uranus', r:5.0, dist:185, speed:0.68, rot:0.030, tex:solidTexture(185,70,60), tilt:1.71},
    {name:'Neptun', r:4.8, dist:220, speed:0.54, rot:0.032, tex:solidTexture(220,80,45), tilt:0.49}
  ];

  // CREARE PLANETE
  var planets=[], planetMeshes=[];
  for(var i=0;i<planetData.length;i++){
    var pd=planetData[i];
    var pivot=new THREE.Object3D();
    pivot.rotation.y=(i/planetData.length)*Math.PI*2;
    scene.add(pivot);
    var mesh=new THREE.Mesh(
      new THREE.SphereGeometry(pd.r,32,32),
      new THREE.MeshPhongMaterial({map:pd.tex, shininess:15})
    );
    mesh.position.x=pd.dist;
    mesh.rotation.z=pd.tilt;
    mesh.castShadow=true; mesh.receiveShadow=true;
    mesh.userData={name:pd.name, index:i};
    pivot.add(mesh);
    if(pd.rings){
      var ring=new THREE.Mesh(
        new THREE.RingGeometry(pd.r*1.4, pd.r*2.5, 64),
        new THREE.MeshBasicMaterial({color:0xc8a870,side:THREE.DoubleSide,transparent:true,opacity:0.7})
      );
      ring.rotation.x=Math.PI/2.2;
      mesh.add(ring);
    }
    planets.push({pivot:pivot, mesh:mesh, data:pd});
    planetMeshes.push(mesh);
  }

  // ORBITE (THREE.Geometry - r101)
  for(var i=0;i<planetData.length;i++){
    var og=new THREE.Geometry();
    for(var j=0;j<=128;j++){
      var a=(j/128)*Math.PI*2;
      og.vertices.push(new THREE.Vector3(Math.cos(a)*planetData[i].dist, 0, Math.sin(a)*planetData[i].dist));
    }
    scene.add(new THREE.Line(og, new THREE.LineBasicMaterial({color:0x334466,transparent:true,opacity:0.5})));
  }

  // ASTEROID BELT — GEOMETRIE PROPRIE (THREE.Geometry cu vertices manual)
  (function(){
    var ag=new THREE.Geometry();
    for(var i=0;i<3000;i++){
      var a=Math.random()*Math.PI*2, r=78+Math.random()*20;
      ag.vertices.push(new THREE.Vector3(Math.cos(a)*r, (Math.random()-0.5)*4, Math.sin(a)*r));
    }
    scene.add(new THREE.Points(ag, new THREE.PointsMaterial({color:0x998877,size:0.5,transparent:true,opacity:0.8})));
  })();

  // PARTICULE — STELE (THREE.Geometry cu vertices)
  (function(){
    var sg=new THREE.Geometry();
    for(var i=0;i<10000;i++){
      var theta=Math.random()*Math.PI*2, phi=Math.acos(2*Math.random()-1), r=600+Math.random()*800;
      sg.vertices.push(new THREE.Vector3(r*Math.sin(phi)*Math.cos(theta), r*Math.sin(phi)*Math.sin(theta), r*Math.cos(phi)));
    }
    scene.add(new THREE.Points(sg, new THREE.PointsMaterial({color:0xffffff,size:0.7,transparent:true,opacity:0.85})));
  })();

  // DAT.GUI
  var guiParams={
    viteza:1.0, pauza:false, intensitateSoare:2.5,
    resetCamera:function(){ camera.position.set(0,80,200); controls.target.set(0,0,0); focusTarget=-1; }
  };
  var gui=new dat.GUI({width:260});
  gui.add(guiParams,'viteza',0,5).step(0.1).name('Viteza animatie');
  gui.add(guiParams,'pauza').name('Pauza');
  gui.add(guiParams,'intensitateSoare',0,5).step(0.1).name('Intensitate Soare').onChange(function(v){sunLight.intensity=v;});
  gui.add(guiParams,'resetCamera').name('Reset Camera');
  var folderPlanete=gui.addFolder('Viteze Individuale');
  var speedOverrides={};
  for(var i=0;i<planetData.length;i++){
    speedOverrides[planetData[i].name]=1.0;
    folderPlanete.add(speedOverrides,planetData[i].name,0,5).step(0.1);
  }

  // CLICK — RAYCASTER
  var raycaster=new THREE.Raycaster(), mouse=new THREE.Vector2(), focusTarget=-1;
  renderer.domElement.addEventListener('click',function(e){
    mouse.x=(e.clientX/window.innerWidth)*2-1;
    mouse.y=-(e.clientY/window.innerHeight)*2+1;
    raycaster.setFromCamera(mouse,camera);
    var hits=raycaster.intersectObjects(planetMeshes);
    if(hits.length>0) focusPlanet(hits[0].object.userData.index);
  });
  function focusPlanet(idx){
    focusTarget=idx;
    var lbl=document.getElementById('focus-label');
    lbl.textContent=planetData[idx].name.toUpperCase();
    lbl.style.opacity='1';
    setTimeout(function(){lbl.style.opacity='0';},2500);
  }

  // TASTATURA
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(k>='1'&&k<='8') focusPlanet(parseInt(k)-1);
    if(k==='r'||k==='R') guiParams.resetCamera();
    if(k==='p'||k==='P'){
      guiParams.pauza=!guiParams.pauza;
      for(var i=0;i<gui.__controllers.length;i++) if(gui.__controllers[i].property==='pauza') gui.__controllers[i].updateDisplay();
    }
    if(k==='+'||k==='=') guiParams.viteza=Math.min(5,guiParams.viteza+0.25);
    if(k==='-') guiParams.viteza=Math.max(0,guiParams.viteza-0.25);
  });

  // RESIZE
  window.addEventListener('resize',function(){
    W=window.innerWidth; H=window.innerHeight;
    camera.aspect=W/H; camera.updateProjectionMatrix(); renderer.setSize(W,H);
  });

  // ANIMATIE
  var clock=new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    var delta=clock.getDelta();
    if(!guiParams.pauza){
      var t=delta*guiParams.viteza;
      sun.rotation.y+=0.004*guiParams.viteza;
      for(var i=0;i<planets.length;i++){
        var p=planets[i], s=speedOverrides[p.data.name]||1.0;
        p.pivot.rotation.y+=p.data.speed*0.005*t*s;
        p.mesh.rotation.y+=p.data.rot*guiParams.viteza;
      }
    }
    if(focusTarget>=0){
      var wp=new THREE.Vector3();
      planets[focusTarget].mesh.getWorldPosition(wp);
      controls.target.lerp(wp,0.05);
    }
    controls.update();
    renderer.render(scene,camera);
  }
  animate();
  </script>
</body>
</html>
